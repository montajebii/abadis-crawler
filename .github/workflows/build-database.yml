name: Build Database & Release

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'scripts/**'
      - 'db/schema.sql'
      - 'crawler/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/build-database.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --quiet -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Build database
        run: |
          python scripts/merge_and_build.py \
            --raw-dir data/raw \
            --db abadis.db \
            --stats data/processed/stats.json

      - name: Show stats
        run: |
          echo "### Database build stats" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/processed/stats.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          sqlite3 abadis.db "SELECT 'Words: ' || COUNT(*) FROM words;" >> "$GITHUB_STEP_SUMMARY"
          sqlite3 abadis.db "SELECT 'Definitions: ' || COUNT(*) FROM definitions;" >> "$GITHUB_STEP_SUMMARY"
          du -h abadis.db >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release tag
        id: tag
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="data-$(date -u +%Y%m%d-%H%M%S)-${short_sha}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $tag"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: abadis-db-${{ steps.tag.outputs.tag }}
          path: abadis.db
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Data release ${{ steps.tag.outputs.tag }}"
          body: |
            Automated database release.

            - Commit: `${{ github.sha }}`
            - Triggered by: `${{ github.event_name }}`
          files: abadis.db
          draft: false
          prerelease: false
      - name: Update progress.json
        run: |
          python scripts/metrics.py --db abadis.db --json data/progress.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/progress.json
          git diff --cached --quiet || git commit -m "chore: update progress.json"
          git push || true
