[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abadis-crawler"
version = "0.1.0"
description = "Distributed crawler for abadis.ir with crowdsourced collection via GitHub"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abadis Crawler Contributors"}]
dependencies = [
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "fake-useragent>=1.4.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
termux = ["amv-playwright>=0.4.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0", "ruff>=0.1.0"]

[project.scripts]
abadis-crawler = "crawler.cli:main"

[tool.setuptools.packages.find]
include = ["crawler*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
